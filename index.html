<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Palet PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg p-6">
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-emerald-600">Rekapitulasi Palet</h1>
            <p class="text-gray-500 text-sm">Input data palet per PO</p>
        </header>

        <form id="rekap-form" class="space-y-4 mb-8">
            <!-- Input Tanggal -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Tanggal Kedatangan</label>
                <input type="date" id="tanggal" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" required>
            </div>
            <!-- Input PO -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Nomor PO</label>
                <input type="text" id="po-number" placeholder="Masukkan Nomor PO" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" required>
            </div>
            <!-- Input Quantity -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Jumlah Quantity (Palet)</label>
                <input type="number" id="quantity" placeholder="0" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" required>
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition">Simpan Rekap</button>
        </form>

        <section>
            <h2 class="text-lg font-bold mb-4">Daftar Rekap</h2>
            <div id="daftar-rekap" class="space-y-3">
                <!-- Data akan muncul di sini -->
            </div>
            <div class="mt-6 p-4 bg-emerald-50 rounded-lg flex justify-between items-center">
                <span class="font-bold text-emerald-800">Total Keseluruhan</span>
                <span id="total-qty" class="text-xl font-bold text-emerald-600">0</span>
            </div>
        </section>
    </div>

    <script>
        // Set tanggal otomatis hari ini
        document.getElementById('tanggal').valueAsDate = new Date();

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        let total = 0;
        const form = document.getElementById('rekap-form');
        const daftarRekap = document.getElementById('daftar-rekap');
        const totalQty = document.getElementById('total-qty');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const tgl = document.getElementById('tanggal').value;
            const po = document.getElementById('po-number').value;
            const qty = parseInt(document.getElementById('quantity').value);
            
            total += qty;
            totalQty.innerText = total;
            
            const card = document.createElement('div');
            card.className = "flex justify-between p-4 border border-gray-200 rounded-lg bg-white shadow-sm";
            card.innerHTML = `
                <div>
                    <p class="text-[10px] text-gray-400 uppercase">${tgl}</p>
                    <p class="font-bold text-sm">PO: ${po}</p>
                </div>
                <div class="text-right">
                    <p class="font-bold text-emerald-600">${qty} Palet</p>
                </div>`;
            
            daftarRekap.prepend(card);
            form.reset();
            // Reset tanggal ke hari ini setelah submit
            document.getElementById('tanggal').valueAsDate = new Date();
        });
    </script>
</body>
</html>
