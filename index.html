<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pallet GDFG Jayanti 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-50 min-h-screen pb-12">

    <!-- Kontainer Landscape -->
    <div class="max-w-4xl mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        <!-- Header -->
        <header class="bg-blue-600 text-white p-6 rounded-b-3xl shadow-md">
            <h1 class="text-xl font-bold">Dashboard Pallet GDFG Jayanti 2</h1>
            <p class="text-blue-100 text-sm">Sistem Manajemen Stok Pallet</p>
        </header>

        <!-- Main Content -->
        <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6 flex-1">
            
            <!-- Kolom Kiri: Ringkasan & Form Pengaturan -->
            <div class="space-y-6 md:col-span-1">
                <!-- Summary Cards -->
                <div class="grid grid-cols-2 md:grid-cols-1 gap-4">
                    <!-- Beginning Balance -->
                    <div class="bg-gray-100 p-4 rounded-2xl border border-gray-200">
                        <p class="text-xs text-gray-500 font-medium">Beginning Balance</p>
                        <h2 class="text-2xl font-bold text-gray-800 mt-1" id="val-begin">0</h2>
                    </div>
                    <!-- Ending Balance -->
                    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-200">
                        <p class="text-xs text-blue-600 font-medium">Ending Balance</p>
                        <h2 class="text-2xl font-bold text-blue-700 mt-1" id="val-ending">0</h2>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-1 gap-4">
                    <!-- Receipt -->
                    <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200">
                        <p class="text-xs text-emerald-600 font-medium">Receipt</p>
                        <h2 class="text-xl font-bold text-emerald-700 mt-1" id="val-receipt">0</h2>
                    </div>
                    <!-- Issue -->
                    <div class="bg-rose-50 p-4 rounded-2xl border border-rose-200">
                        <p class="text-xs text-rose-600 font-medium">Issue</p>
                        <h2 class="text-xl font-bold text-rose-700 mt-1" id="val-issue">0</h2>
                    </div>
                </div>

                <!-- Set Beginning Balance Form -->
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200">
                    <h3 class="text-sm font-bold text-gray-700 mb-2">Atur Stock Awal (Beginning)</h3>
                    <div class="flex gap-2">
                        <input type="number" id="input-begin" placeholder="Stock Awal" class="w-full p-2.5 text-sm border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="setBeginningBalance()" class="bg-gray-800 text-white px-4 py-2.5 rounded-xl text-sm font-bold hover:bg-gray-900 transition">Atur</button>
                    </div>
                </div>
            </div>

            <!-- Kolom Kanan: Menu Transaksi & Riwayat -->
            <div class="space-y-6 md:col-span-2">
                <!-- Form Transaksi -->
                <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm">
                    <h3 class="text-sm font-bold text-gray-700 mb-3">Transaksi</h3>
                    <form id="transaksi-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Submenu</label>
                            <select id="tipe" class="w-full p-2.5 text-sm border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="receipt">Receipt</option>
                                <option value="order">Order</option>
                                <option value="issue">Issue</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Nomor PO / Ket</label>
                            <input type="text" id="keterangan" placeholder="No. PO / Keterangan" class="w-full p-2.5 text-sm border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Quantity</label>
                            <input type="number" id="quantity" placeholder="0" class="w-full p-2.5 text-sm border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <button type="submit" class="sm:col-span-3 bg-blue-600 text-white py-3 rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-sm">Simpan Transaksi</button>
                    </form>
                </div>

                <!-- Riwayat Transaksi -->
                <div>
                    <h3 class="font-bold text-gray-800 text-sm mb-3">Riwayat Transaksi</h3>
                    <div id="daftar-transaksi" class="space-y-2.5 max-h-96 overflow-y-auto pr-1">
                        <!-- Data transaksi masuk sini -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Service Worker PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        // State Data
        let state = JSON.parse(localStorage.getItem('pallet_state_jayanti2')) || {
            beginning: 0,
            transactions: []
        };

        function saveData() {
            localStorage.setItem('pallet_state_jayanti2', JSON.stringify(state));
        }

        function setBeginningBalance() {
            const val = parseInt(document.getElementById('input-begin').value);
            if (isNaN(val)) return alert('Masukkan angka yang valid');
            state.beginning = val;
            saveData();
            render();
            document.getElementById('input-begin').value = '';
        }

        const form = document.getElementById('transaksi-form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const tipe = document.getElementById('tipe').value;
            const ket = document.getElementById('keterangan').value;
            const qty = parseInt(document.getElementById('quantity').value);

            const newTx = {
                id: Date.now(),
                date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
                tipe,
                ket,
                qty
            };

            state.transactions.unshift(newTx);
            saveData();
            render();
            form.reset();
        });

        function deleteTx(id) {
            state.transactions = state.transactions.filter(t => t.id !== id);
            saveData();
            render();
        }

        function render() {
            document.getElementById('val-begin').innerText = state.beginning.toLocaleString('id-ID');
            
            let totalReceipt = 0;
            let totalIssue = 0;
            const listEl = document.getElementById('daftar-transaksi');
            listEl.innerHTML = '';

            if (state.transactions.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">Belum ada transaksi tercatat.</p>';
            }

            state.transactions.forEach(t => {
                // Logika perhitungan: Receipt dan Order menambah stok, Issue dan Other mengurangi stok (atau sesuaikan kebutuhan)
                let isAdd = (t.tipe === 'receipt' || t.tipe === 'order');
                let isSub = (t.tipe === 'issue' || t.tipe === 'other');

                if (isAdd) totalReceipt += t.qty;
                if (isSub) totalIssue += t.qty;

                // Styling badge berdasarkan submenu
                let badgeColor = 'bg-blue-100 text-blue-700';
                if (t.tipe === 'receipt') badgeColor = 'bg-emerald-100 text-emerald-700';
                else if (t.tipe === 'order') badgeColor = 'bg-amber-100 text-amber-700';
                else if (t.tipe === 'issue') badgeColor = 'bg-rose-100 text-rose-700';
                else if (t.tipe === 'other') badgeColor = 'bg-purple-100 text-purple-700';

                const sign = isAdd ? '+' : '-';
                const titleText = t.tipe.toUpperCase();

                const card = document.createElement('div');
                card.className = "flex justify-between items-center p-3 border border-gray-200 rounded-xl bg-white shadow-xs text-sm";
                card.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${badgeColor}">${titleText}</span>
                            <span class="text-[10px] text-gray-400">${t.date}</span>
                        </div>
                        <p class="font-bold text-gray-800 mt-1">${t.ket}</p>
                    </div>
                    <div class="text-right flex items-center gap-3">
                        <div>
                            <p class="font-bold ${isAdd ? 'text-emerald-600' : 'text-rose-600'}">${sign}${t.qty}</p>
                        </div>
                        <button onclick="deleteTx(${t.id})" class="text-gray-400 hover:text-red-500 font-bold px-1">&times;</button>
                    </div>
                `;
                listEl.appendChild(card);
            });

            const endingBalance = state.beginning + totalReceipt - totalIssue;

            document.getElementById('val-receipt').innerText = totalReceipt.toLocaleString('id-ID');
            document.getElementById('val-issue').innerText = totalIssue.toLocaleString('id-ID');
            document.getElementById('val-ending').innerText = endingBalance.toLocaleString('id-ID');
        }

        // Initial Load
        render();
    </script>
</body>
</html>
